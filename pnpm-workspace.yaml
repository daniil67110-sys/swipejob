packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@sentry-internal/node-cpu-profiler": true
  "@sentry/cli": true
  argon2: true
  core-js: false
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  protobufjs: false
  sharp: true
onlyBuiltDependencies:
  - lefthook
  - esbuild
  - sharp
  - msgpackr-extract
  - "@sentry/cli"
  - "@sentry-internal/node-cpu-profiler"
  - argon2
