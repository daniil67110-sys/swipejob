packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@sentry-internal/node-cpu-profiler": true
  "@sentry/cli": true
  argon2: true
  core-js: false
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  protobufjs: false
  sharp: true
  # Story 6.7 — apportés transitivement par next-intl@4.12.0.
  # `@parcel/watcher` = file watcher dev only (pas requis en build/runtime prod).
  # `@swc/core` = compilation TS, Next.js gère son propre SWC, doublon inutile.
  "@parcel/watcher": false
  "@swc/core": false
onlyBuiltDependencies:
  - lefthook
  - esbuild
  - sharp
  - msgpackr-extract
  - "@sentry/cli"
  - "@sentry-internal/node-cpu-profiler"
  - argon2
